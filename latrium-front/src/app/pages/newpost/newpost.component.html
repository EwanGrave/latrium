<div id="new-post">
  <div>Nouveau post</div>
  <form class="register-form" [formGroup]="postForm">
    <mat-form-field>
      <mat-label>Titre</mat-label>
      <input matInput type="text" formControlName="title" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Contenu</mat-label>
      <textarea matInput type="password" formControlName="content"></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Board</mat-label>
      <mat-select formControlName="boardName">
        <mat-option value="one">First option</mat-option>
        <mat-option value="two">Second option</mat-option>
      </mat-select>
    </mat-form-field>

    <button type="submit" mat-flat-button [disabled]="postForm.invalid">
      Valider
    </button>
  </form>
</div>
